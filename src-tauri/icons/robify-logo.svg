<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    the robify mark: two notes under a shared beam.

    a draft next to it let three marks float freely, and here a continuous
    stroke holds them together and becomes the waveform at the same time. the
    mark reads as one body instead of a group and therefore stays calmer at
    small sizes.
  -->
  <!--
    without the trailing wave the drawing has grown narrower. this transform
    moves its new centre (204/288) into the middle of the field and scales it
    up by close to half. at least 60 px of margin are left all around
    afterwards, enough for the round android mask.
  -->
  <g fill="#a8a8b3" transform="translate(256 256) scale(1.45) translate(-204 -288)">
    <!-- the beam over both stems, rising. -->
    <path d="M150 214 L338 166 v52 L150 266 z" />

    <!--
      the stems.

      the right one starts at 172.64 instead of at 166: exactly there lies the
      top edge of the rising beam on its left side. set higher, its top left
      corner looked out over the beam and formed a small step, a visible ledge
      at a large size and a frayed edge at a small one.

      the bottom edge stays at 316 and the height makes up for it.
    -->
    <rect x="150" y="214" width="26" height="150" />
    <rect x="312" y="172.64" width="26" height="143.36" />

    <!-- the note heads, tilted as in musical notation. -->
    <ellipse cx="120" cy="366" rx="52" ry="40" transform="rotate(-20 120 366)" />
    <ellipse cx="282" cy="318" rx="52" ry="40" transform="rotate(-20 282 318)" />
  </g>
</svg>
