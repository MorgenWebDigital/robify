[package]
name = "robify"
version = "0.1.0"
description = "Robify: Musikplayer, Bibliothek, Statistiken und Downloader"
authors = ["MorgenWebDigital - Rettungsreifen <info@morgenwebdigital.de>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/MorgenWebDigital/robify"
homepage = "https://github.com/MorgenWebDigital/robify"
edition = "2021"
rust-version = "1.82"

[lib]
name = "robify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# needed on android alone: two libraries in the tree want a handle into the
# java runtime that nobody gives them there. see `src/android.rs`
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
rustls-platform-verifier = "0.6"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.40", features = ["bundled"] }
rodio = { version = "0.22", features = ["symphonia-all"] }
lofty = "0.25"

reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "webpki-roots",
  "charset",
  "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

anyhow = "1"
base64 = "0.22"
chrono = "0.4"
walkdir = "2"
parking_lot = "0.12"
urlencoding = "2"
rand = "0.9"
which = "8"
# unpacks the ffmpeg and deno builds robify fetches itself
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# set by `tauri dev`, it disables the production csp
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
