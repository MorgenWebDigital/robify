<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content`: when the keyboard slides out, the
      area the page computes in shrinks with it. without the value it stays as
      it was and the browser pushes the whole page up instead, which made the
      title row disappear under the status bar of the system and left the bar
      at the bottom behind the keyboard.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Robify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
