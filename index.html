<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content`: Fährt die Tastatur aus, schrumpft
      damit der Bereich, in dem die Seite rechnet. Ohne die Angabe bleibt er,
      wie er war, und der Browser schiebt stattdessen die ganze Seite nach
      oben — die Titelzeile verschwand dabei unter der Statusleiste des
      Systems, und die Leiste unten lag hinter der Tastatur.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Robify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
