# checks every push and every pull request.
#
# kept apart from the release workflow and deliberately narrow: it runs at
# every change and therefore has to be fast. only what is needed for checking
# is built, and on a single system, the six installers come into being at
# release.
name: Checks

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

# a new push to the same branch cancels the previous run. without it, several
# commits in a row pile up runs whose result interests nobody any more.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Interface
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the types
        run: npx tsc --noEmit

      - name: Check the formatting
        run: npx prettier --check src/ scripts/

      # the guards over the translation sit under it: they read the ui and
      # the rust sources alike and fire as soon as german text without a
      # version stands anywhere
      - name: Tests
        run: npm test

      - name: No unwrapped German text
        run: node scripts/deutsch-finden.mjs

  backend:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # store it even where a later step fails. out of the box the action
          # throws the cache away on a failure, and a typo in the signing
          # password thereby undid twenty-five minutes of compilation, with the
          # next run starting from zero again
          cache-on-failure: true

      # the same list as in the release workflow: without webkitgtk the tauri
      # part cannot even be compiled
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libxdo-dev libgtk-3-dev

      # the build needs the ui as finished files, and they are not generated
      # here, so an empty placeholder is created
      - name: Placeholder for the interface
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      # `cargo fmt --check` deliberately does not run here: the rust part is
      # set by hand and differs from rustfmt in 165 places, at every line
      # width. formatting it through once would be possible but is a decision
      # of its own and no side effect of this workflow

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      # the tests needing a network carry `#[ignore]` and stay out here: an
      # outage at youtube or spotify is no bug in this project
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # the rust part for android is untouched by the two jobs above: it hangs
  # almost entirely behind `#[cfg(target_os = "android")]` and is invisible on
  # a desktop. exactly there a missing import stayed behind, the build broke
  # off, and an old version kept running on the test device for days without
  # anybody noticing.
  #
  # it is compiled only, not packaged: the apk comes into being at release.
  # that costs a few minutes instead of half an hour and still catches every
  # error in this part.
  android:
    name: Rust for Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-on-failure: true

      - name: Placeholder for the interface
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      # `aws-lc-sys` compiles c code of its own and looks for a compiler
      # called `aarch64-linux-android-clang` for it. that does not exist in
      # the ndk: every compiler carries the lowest supported android version
      # in its name there. without this assignment the build script already
      # fails
      - name: Clippy
        env:
          CC_aarch64_linux_android: aarch64-linux-android26-clang
          AR_aarch64_linux_android: llvm-ar
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cargo clippy --manifest-path src-tauri/Cargo.toml \
            --lib --target aarch64-linux-android
