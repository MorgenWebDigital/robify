name: Release

# builds every installer. startable by hand or through a tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# the jobs create the release and hang the installers on it. without this the
# repository default applies, and that is read — the build then runs through
# and fails at the last step with "Resource not accessible by integration"
permissions:
  contents: write

jobs:
  # the signing job runs last, so a missing key only showed after every
  # installer was built — twenty-one minutes on six systems, thrown away with
  # the runners. an empty secret is enough for that: the name exists, the
  # value is nothing, and `gh secret list` shows no difference.
  #
  # ten seconds up front instead. checked is only presence; whether a key
  # actually decodes shows where it is used
  geheimnisse:
    name: Check the secrets
    runs-on: ubuntu-latest
    steps:
      # the condition sits on the step and not on the job: a skipped job takes
      # everything that needs it along, and a run started by hand builds no
      # release and needs none of these secrets
      - if: github.ref_type == 'tag'
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in PGP_PRIVATE_KEY PGP_PASSPHRASE TAURI_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is empty. See the readme, section \"Checking the installers\"."
              exit 1
            fi
          done

          case "$PGP_PRIVATE_KEY" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
            *) echo "::error::PGP_PRIVATE_KEY does not hold an armored private key. Export it with: gpg --armor --export-secret-keys <fingerprint> > key.asc, check the file is several thousand bytes, then set it from that file."
               exit 1 ;;
          esac

  desktop:
    needs: geheimnisse
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb, rpm, appimage
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: "--bundles deb,rpm,appimage"
          # exe (nsis) and msi
          - os: windows-latest
            label: Windows (exe, msi)
            args: "--bundles nsis,msi"
          # dmg for apple silicon
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin --bundles dmg,app"
          # dmg for intel macs
          - os: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin --bundles dmg,app"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            rpm \
            build-essential \
            curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - name: Install the dependencies
        run: npm ci

      # the text of the release comes out of the changelog, not out of a
      # sentence pointing at it. robify reads it from the release when
      # somebody asks what has changed, and it cannot open a file that lies
      # in the repository
      - name: Notes of the release
        id: notizen
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          {
            echo 'text<<AENDERUNGEN'
            node scripts/aenderungen.mjs "${{ github.ref_name }}"
            echo ''
            echo 'AENDERUNGEN'
          } >> "$GITHUB_OUTPUT"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update artefacts and writes `latest.json` next to them.
          # without it robify cannot tell an update apart from a file that
          # merely lies under the right address
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # a draft instead of a release: the run collects every installer on
          # one release page without publishing it. that way one can check
          # beforehand whether every format is really there, as with six
          # systems one of them fails silently sooner or later
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Robify ${{ github.ref_name }}
          releaseBody: ${{ steps.notizen.outputs.text }}
          releaseDraft: true
          prerelease: false

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: robify-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: warn

  arch:
    needs: geheimnisse
    name: Arch Linux (pacman)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Base packages
        run: |
          pacman -Syu --noconfirm
          # github-cli is not in the container. the runner image brings it
          # along, this job does not run on it — without it hanging the
          # package on the release ends with "command not found"
          pacman -S --noconfirm git rust nodejs npm webkit2gtk-4.1 gtk3 \
            alsa-lib openssl pkgconf sudo github-cli

      - uses: actions/checkout@v4

      - name: Set up the build user
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Build the package
        run: sudo -u builder bash -c "cd packaging/arch && makepkg -f --noconfirm"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: robify-arch-pacman
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

      # the artefact alone hangs off the run and is deleted after ninety days.
      # the signing job reads the draft of the release, so what is not hung on
      # here stays unsigned and does not reach anybody.
      #
      # the draft is created by the desktop job, which runs alongside this one.
      # whoever finishes first would not find it yet, hence the wait
      - name: Hang the package on the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # without this the loop below waits ten minutes for a draft while the
          # real cause is a missing command
          command -v gh >/dev/null || {
            echo "::error::gh is not installed in this job."
            exit 1
          }
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            echo "the draft does not exist yet, attempt $i of 60"
            sleep 10
          done
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            packaging/arch/*.pkg.tar.zst

  android:
    needs: geheimnisse
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        # the default also asks for `tools`, which google no longer
        # publishes, and sdkmanager then fails the whole step
        with:
          packages: platform-tools

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install the dependencies
        run: npm ci

      # chaquopy runs pip while building and wants an interpreter of exactly
      # the target version for it. 3.11 and no newer one: below that chaquopy
      # drops armeabi-v7a and x86, and every 32-bit device would lose the app
      - name: Set up Python for the build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # the javascript runtime yt-dlp needs for youtube. small, but it is
      # compiled for four architectures, so it is kept between runs
      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: src-tauri/android/quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('scripts/quickjs-bauen.mjs') }}

      # the converter, likewise built here and not taken ready-made: the
      # ready-made android builds carry x264 and its like and are gpl
      # throughout. this one holds no video encoder at all
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/android/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-bauen.mjs') }}

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          # javascript runtime and converter first, the retrofit script lays
          # them in
          node scripts/quickjs-bauen.mjs
          node scripts/ffmpeg-bauen.mjs
          # what tauri does not offer is added afterwards, see the script
          node scripts/android-nachruesten.mjs

      # one apk for every device instead of `--split-per-abi`: split apart, the
      # right one of four files has to be picked by hand, and picking wrong
      # gives an installation that fails without saying why. the universal apk
      # is about twenty megabytes larger and installs anywhere.
      - name: Build the APK
        run: npx tauri android build --apk

      # what the package actually carries, read out of it — not out of a list
      # somebody keeps. a gpl library reached the apk twice this way without
      # anyone noticing, and it would have made it impossible to pass on
      # under robify's licence
      - name: Check the licences in the APK
        run: node scripts/apk-lizenzen.mjs

      # without a signature an apk cannot be installed on any device.
      # `tauri android build` delivers it unsigned, and setting gradle up for
      # it would bring nothing because the project under `gen/` is created
      # anew at every run. `apksigner` works on the finished file
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The secret ANDROID_KEYSTORE is missing. See the readme, section \"The test device\"."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/robify.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/robify.keystore" \
                       -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Usually ANDROID_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          werkzeuge="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          roh="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)"
          "$werkzeuge/zipalign" -p -f 4 "$roh" Robify_${{ github.ref_name }}.apk
          "$werkzeuge/apksigner" sign \
            --ks "$RUNNER_TEMP/robify.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEYSTORE_PASSWORD" \
            Robify_${{ github.ref_name }}.apk
          "$werkzeuge/apksigner" verify --print-certs Robify_${{ github.ref_name }}.apk
          rm -f "$RUNNER_TEMP/robify.keystore"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: robify-android-apk
          path: Robify_*.apk
          if-no-files-found: error

      # same as with the arch package: without this the apk stays an artefact
      # of the run, unsigned by pgp and gone after ninety days. the wait is
      # for the draft, which the desktop job creates alongside
      - name: Hang the APK on the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # without this the loop below waits ten minutes for a draft while the
          # real cause is a missing command
          command -v gh >/dev/null || {
            echo "::error::gh is not installed in this job."
            exit 1
          }
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            echo "the draft does not exist yet, attempt $i of 60"
            sleep 10
          done
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            Robify_*.apk

  # --- signing ---
  #
  # a job of its own at the end instead of in every build: the installers come
  # into being on six systems, and the private key is to lie in one place, not
  # on each of them. by this point the draft of the release carries every
  # file, and they are fetched, signed, and the signatures laid next to
  # them.
  signieren:
    name: Sign the installers
    needs: [desktop, arch, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Import the key
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "::error::The secret PGP_PRIVATE_KEY is missing."
            exit 1
          fi
          printf '%s' "$PGP_PRIVATE_KEY" | gpg --batch --import
          # the key is our own, and without this trust gpg asks back while
          # signing and would stand in the workflow without an answer
          gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/{print $10":6:"}' \
            | gpg --batch --import-ownertrust

      - name: Fetch the files of the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p signatur && cd signatur
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*' --clobber
          ls -la

      - name: Sign
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          cd signatur
          # one checksum file for everything, and only that one is signed.
          # whoever verifies it holds the hash of every file in a form that
          # cannot be forged, and can check any single one against it
          sha256sum -- * > SHA256SUMS

          signieren() {
            if [ -n "$PGP_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$PGP_PASSPHRASE" \
                  --armor --detach-sign "$1"
            else
              gpg --batch --yes --armor --detach-sign "$1"
            fi
          }

          signieren SHA256SUMS
          ls -la SHA256SUMS SHA256SUMS.asc

      - name: Attach the signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd signatur
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            SHA256SUMS SHA256SUMS.asc --clobber

      # the release page shows every file as an equal row. with a signature
      # per installer, twelve downloads became forty rows, and somebody who
      # only wants the deb has to look for it. the guarantee stays: the
      # checksum file is signed, and through it every single file can be
      # checked.
      #
      # the .sig files belong to the updater, which reads its signature out of
      # latest.json and never fetches them
      - name: Clear away the loose signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
          | grep -E '\.(sig|asc)$' \
          | grep -vx 'SHA256SUMS.asc' \
          | while read -r name; do
              echo "removing $name"
              gh release delete-asset "${{ github.ref_name }}" "$name" \
                --repo "${{ github.repository }}" --yes
            done
