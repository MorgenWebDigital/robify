# builds an apk for the test device at every push to `main`.
#
# kept apart from the release workflow: that one builds six systems and runs
# on a tag alone. here it is about a single state for a single device, and it
# is to arrive there without help.
#
# the apk lands as an asset of a pre-release under the fixed tag `testgeraet`
# and not as an artifact: artifacts can be downloaded through the browser
# alone and only while logged in, while the assets of a release can be reached
# under a fixed address an updater on the device can poll.
name: Testgerät

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testgeraet
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK bauen und bereitstellen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # right at the front, before sdk, ndk and the build: a wrong password
      # used to show only at signing time, so after twenty-five minutes of
      # building. here the insight takes five seconds
      - name: Schlüssel prüfen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Das Geheimnis ANDROID_$name fehlt. Siehe README, Abschnitt „Testgerät“."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/robify.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/robify.keystore" \
                       -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/schluessel.txt" 2>&1; then
            echo "::error::Der Keystore ließ sich nicht öffnen. Meist stimmt ANDROID_KEYSTORE_PASSWORD nicht. Prüfe es mit: keytool -list -keystore robify-release.keystore"
            grep -v 'password' "$RUNNER_TEMP/schluessel.txt" | head -3
            exit 1
          fi

          if ! grep -qi "^$KEY_ALIAS," "$RUNNER_TEMP/schluessel.txt"; then
            echo "::error::Im Keystore gibt es keinen Eintrag namens „$KEY_ALIAS“. Vorhanden:"
            grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/schluessel.txt" | cut -d, -f1
            exit 1
          fi
          echo "Schlüssel „$KEY_ALIAS“ gefunden, Kennwort passt."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: NDK installieren
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Rust mit Android-Zielen
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # store it even where a later step fails. out of the box the action
          # throws the cache away on a failure, and a typo in the signing
          # password thereby undid twenty-five minutes of compilation, with the
          # next run starting from zero again
          cache-on-failure: true

      - run: npm ci

      - name: Android-Projekt erzeugen
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init --ci
          # what tauri does not offer is added afterwards, see the script
          node scripts/android-nachruesten.mjs

      - name: APK bauen
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk

      # signing happens after building and not through gradle: the android
      # project under `gen/` is created anew at every run, so a signing rule
      # entered there would be gone every time. `apksigner` works on the
      # finished file and is untouched by it
      - name: APK unterschreiben
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # the keystore lies unpacked already, see the key check above
          werkzeuge="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          roh="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)"
          if [ -z "$roh" ]; then
            echo "::error::Keine unsignierte APK gefunden."
            exit 1
          fi

          "$werkzeuge/zipalign" -p -f 4 "$roh" robify.apk
          "$werkzeuge/apksigner" sign \
            --ks "$RUNNER_TEMP/robify.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEYSTORE_PASSWORD" \
            robify.apk
          "$werkzeuge/apksigner" verify --print-certs robify.apk

          rm -f "$RUNNER_TEMP/robify.keystore"

      # a fixed tag instead of a new release per push: the updater on the
      # device polls the same address every time, and the list of releases
      # stays clear
      - name: Vorabversion aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kurz="$(git rev-parse --short HEAD)"
          gh release delete testgeraet --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create testgeraet robify.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Testgerät ($kurz)" \
            --notes "Automatisch gebaut aus $kurz. Nicht für den allgemeinen Gebrauch gedacht." \
            --prerelease \
            --target "$GITHUB_SHA"
