# builds an apk for the test device at every push to `main`.
#
# kept apart from the release workflow: that one builds six systems and runs
# on a tag alone. here it is about a single state for a single device, and it
# is to arrive there without help.
#
# the apk lands as an asset of a pre-release under the fixed tag `testgeraet`
# and not as an artifact: artifacts can be downloaded through the browser
# alone and only while logged in, while the assets of a release can be reached
# under a fixed address an updater on the device can poll.
#
# that pre-release lies in a private repository of its own, named in
# `TESTGERAET_REPO`. in this one it would stand publicly next to the released
# version from the first push on: a half finished build, installable, and
# hardly to be told apart from the real thing by a stranger.
name: Test device

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testgeraet
  cancel-in-progress: true

# only reading: the release is written into the other repository, and for
# that the token of the run does not suffice anyway
permissions:
  contents: read

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # right at the front, before sdk, ndk and the build: a wrong password
      # used to show only at signing time, so after twenty-five minutes of
      # building. here the insight takes five seconds
      - name: Check the secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TESTGERAET_TOKEN: ${{ secrets.TESTGERAET_TOKEN }}
          TESTGERAET_REPO: ${{ secrets.TESTGERAET_REPO }}
        run: |
          for name in TESTGERAET_TOKEN TESTGERAET_REPO; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. See the readme, section \"The test device\"."
              exit 1
            fi
          done

          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret ANDROID_$name is missing. See the readme, section \"The test device\"."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/robify.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/robify.keystore" \
                       -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/schluessel.txt" 2>&1; then
            echo "::error::The keystore could not be opened. Usually ANDROID_KEYSTORE_PASSWORD is wrong. Check it with: keytool -list -keystore robify-release.keystore"
            grep -v 'password' "$RUNNER_TEMP/schluessel.txt" | head -3
            exit 1
          fi

          if ! grep -qi "^$KEY_ALIAS," "$RUNNER_TEMP/schluessel.txt"; then
            echo "::error::The keystore holds no entry called \"$KEY_ALIAS\". Present:"
            grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/schluessel.txt" | cut -d, -f1
            exit 1
          fi
          echo "Key \"$KEY_ALIAS\" found, the password fits."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # store it even where a later step fails. out of the box the action
          # throws the cache away on a failure, and a typo in the signing
          # password thereby undid twenty-five minutes of compilation, with the
          # next run starting from zero again
          cache-on-failure: true

      - run: npm ci

      # chaquopy runs pip while building and wants an interpreter of exactly
      # the target version for it. 3.11 and no newer one: below that chaquopy
      # drops armeabi-v7a and x86, and every 32-bit device would lose the app
      - name: Set up Python for the build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # the javascript runtime yt-dlp needs for youtube. small, but it is
      # compiled for four architectures, so it is kept between runs
      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: src-tauri/android/quickjs
          key: quickjs-${{ runner.os }}-${{ hashFiles('scripts/quickjs-bauen.mjs') }}

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init --ci
          # the javascript runtime first, the retrofit script lays it in
          node scripts/quickjs-bauen.mjs
          # what tauri does not offer is added afterwards, see the script
          node scripts/android-nachruesten.mjs

      # one apk for every device instead of `--split-per-abi`: split apart, the
      # right one of four files has to be picked by hand, and picking wrong
      # gives an installation that fails without saying why. the universal apk
      # is about twenty megabytes larger and installs anywhere.
      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk

      # signing happens after building and not through gradle: the android
      # project under `gen/` is created anew at every run, so a signing rule
      # entered there would be gone every time. `apksigner` works on the
      # finished file and is untouched by it
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # the keystore lies unpacked already, see the key check above
          werkzeuge="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          roh="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)"
          if [ -z "$roh" ]; then
            echo "::error::No unsigned APK found."
            exit 1
          fi

          "$werkzeuge/zipalign" -p -f 4 "$roh" robify.apk
          "$werkzeuge/apksigner" sign \
            --ks "$RUNNER_TEMP/robify.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEYSTORE_PASSWORD" \
            robify.apk
          "$werkzeuge/apksigner" verify --print-certs robify.apk

          rm -f "$RUNNER_TEMP/robify.keystore"

      # a fixed tag instead of a new release per push: the updater on the
      # device polls the same address every time, and the list of releases
      # stays clear
      - name: Update the pre-release
        env:
          # a token of its own: the token of the run reaches this repository
          # only, and the release is to land in the other one
          GH_TOKEN: ${{ secrets.TESTGERAET_TOKEN }}
          ZIEL: ${{ secrets.TESTGERAET_REPO }}
        run: |
          kurz="$(git rev-parse --short HEAD)"
          # `--cleanup-tag` takes the tag with it. left standing, it would keep
          # pointing at the state of the previous build
          gh release delete testgeraet --repo "$ZIEL" --yes --cleanup-tag || true
          # deliberately without `--target`: this commit does not exist over
          # there, and github refuses a tag on a commit it does not know. the
          # tag lands on the default branch of the other repository, and what
          # is fetched from there is the asset, not the commit
          gh release create testgeraet robify.apk \
            --repo "$ZIEL" \
            --title "Test device ($kurz)" \
            --notes "Built automatically from commit $kurz of the robify sources. Not meant for general use." \
            --prerelease
